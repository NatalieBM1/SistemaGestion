services:
  # ──────────────────────────────────────────────────────────────────────────
  # Backend — FastAPI
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: sistemagestion-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistemagestion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        sync: false   # fijar manualmente en el dashboard antes del primer deploy
      - key: CORS_ORIGINS
        value: https://sistemagestion-web.onrender.com

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend — React + Vite (Static Site)
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: sistemagestion-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://sistemagestion-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ──────────────────────────────────────────────────────────────────────────
# Base de datos — PostgreSQL
# ──────────────────────────────────────────────────────────────────────────
databases:
  - name: sistemagestion-db
    plan: free
    databaseName: remisiones
    user: remisiones

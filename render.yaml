services:
  # ──────────────────────────────────────────────────────────────────────────
  # Backend — FastAPI
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: sistemagestion-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # Oculta /docs, /redoc y /openapi.json y activa HSTS.
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sistemagestion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        sync: false   # fijar manualmente en el dashboard antes del primer deploy
      - key: CORS_ORIGINS
        value: https://sistemagestion-web.onrender.com

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend — React + Vite (Static Site)
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: sistemagestion-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://sistemagestion-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Cabeceras de seguridad del frontend. Render no lee archivos _headers:
    # se configuran aquí (o, si el servicio no se creó desde este blueprint,
    # en el panel: Settings → Headers, con los mismos valores).
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: X-XSS-Protection
        value: "0"

# ──────────────────────────────────────────────────────────────────────────
# Base de datos — PostgreSQL
# ──────────────────────────────────────────────────────────────────────────
databases:
  - name: sistemagestion-db
    plan: free
    databaseName: remisiones
    user: remisiones

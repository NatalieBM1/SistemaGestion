services:
  db:
    image: postgres:16
    container_name: sistemagestion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-remisiones}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword123}
      POSTGRES_DB: ${DB_NAME:-remisiones}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-remisiones} -d ${DB_NAME:-remisiones}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
